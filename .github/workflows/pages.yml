# Đưa web app thu thập dữ liệu (webapp/) lên GitHub Pages mỗi khi webapp/ hoặc labels.json thay đổi trên main.
# Bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy webapp to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["webapp/**", "labels.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp webapp/index.html webapp/app.js webapp/config.js webapp/style.css labels.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
